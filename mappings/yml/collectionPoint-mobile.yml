prefixes:
  waste: "https://w3id.org/def/medioambiente/residuos#"
  esdir: "https://vocab.linkeddata.es/datosabiertos/def/urbanismo-infraestructuras/direccion-postal#"
  esadm: "https://vocab.linkeddata.es/datosabiertos/def/sector-publico/territorio#"
  rdfs: "http://www.w3.org/2000/01/rdf-schema#"
  gsp: "http://www.opengis.net/ont/geosparql#"
  xsd: "http://www.w3.org/2001/XMLSchema#"
  schema: "https://schema.org/"

sources:
  mobileCollectionPoint-source: [dataset-enriquecido-2.csv~csv]

mappings:
  MobileCollectionPoint:
    sources:
      - mobileCollectionPoint-source
    s: https://w3id.org/medioambiente/recurso/residuos/collectionPoint/mobile/$(Identificador normalizado)
    po:
      - [a, waste:MobileCollectionPoint]
      - [schema:openingHours, $(Día de la semana) $(Turno) $(Hora de inicio)-$(Hora de fin), xsd:string]
      - [waste:admissibleWasteURL, $(Residuos admisibles), xsd:anyURI]
      - [schema:map, $(Google Maps), xsd:anyURI]
      - [schema:address, https://w3id.org/medioambiente/recurso/residuos/address/$(Ubicación normalizada)~iri]
      - [waste:belongsTo, https://w3id.org/medioambiente/recurso/residuos/district/$(Distrito)~iri]
      - [gsp:hasGeometry, https://w3id.org/medioambiente/recurso/residuos/geometry/collectionPoint/mobile/$(Ubicación normalizada)~iri]

  DireccionPostal:
    sources:
      - mobileCollectionPoint-source
    s: https://w3id.org/medioambiente/recurso/residuos/address/$(Ubicación normalizada)
    po:
      - [a, esdir:DireccionPostal]

  District:
    sources:
      - mobileCollectionPoint-source
    s: https://w3id.org/medioambiente/recurso/residuos/district/$(Distrito)
    po:
      - [a, esadm:Distrito]
      - [rdfs:label, $(Distrito), es~lang]

  GeometryMobileCollectionPoint:
    sources:
      - mobileCollectionPoint-source
    s: https://w3id.org/medioambiente/recurso/residuos/geometry/collectionPoint/mobile/$(Ubicación normalizada)
    po:
      - [a, gsp:Geometry]
      - [gsp:asWKT, "POINT($(Longitud) $(Latitud))", gsp:wktLiteral]